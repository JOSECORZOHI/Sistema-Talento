name: CI (Lint + Tests + Smoke)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar sintaxis
        run: node --check server.js && node --check db.js && node --check documentAnalyzer.js

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint del frontend
        run: npm run lint:frontend

      - name: Tests unitarios y smoke
        run: npm test
        env:
          # Opcional: definir la variable de repositorio SMOKE_BASE_URL con la URL
          # pública cuando el servicio esté desplegado. Sin ella, los 3 smoke HTTP
          # se omiten y el CI no depende de producción.
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          # El smoke reintenta hasta ~40s ante 5xx/red (reinicio de Railway durante
          # el despliegue); una regresión real (200 donde se espera 404) falla al instante.